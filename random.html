<!DOCTYPE html>
<html>
<head>
  <title>랜덤 뽑기</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 100px;
      background-color: #f4f4f4;
    }

    h1 {
      color: #333;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      background-color: #4CAF50;
      color: white;
    }

    #result {
      margin-top: 30px;
      font-size: 30px;
      color: #222;
    }
  </style>
</head>

<body>

  <h1>🎲 랜덤 메뉴 추천기</h1>

  <button onclick="pickRandom()">
    랜덤 뽑기
  </button>

  <p id="result">여기에 결과가 나와요!</p>

  <script>

    const menu = [
      "햄버거 🍔",
      "떡볶이 🌶️",
      "마라탕 🍜",
      "초밥 🍣",
      "파스타 🍝",
      "치킨 🍗"
    ];

    function pickRandom() {

      const randomIndex =
        Math.floor(Math.random() * menu.length);

      document.getElementById("result").innerText =
        menu[randomIndex];
    }

  </script>

</body>
</html>
