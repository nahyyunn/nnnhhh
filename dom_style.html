<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>DOM 스타일 제어하기</title>

  <style>

    body{
      text-align:center;
      font-family:Arial;
      margin-top:50px;
    }

    #text{
      background-color:gold;
      padding:40px;
      width:700px;
      margin:auto;
      font-size:50px;
      color:brown;
      font-weight:bold;
      transition:0.3s;
    }

    button{
      margin:20px 10px;
      padding:15px 25px;
      font-size:20px;
      cursor:pointer;
      border-radius:10px;
      border:none;
    }

  </style>
</head>

<body>

<h1>실습 1 : DOM 스타일 제어하기</h1>

<div id="text">
  이 문장의 스타일을 바꿔보세요!
</div>

<br>

<button onclick="changeColor()">
  글자색 변경
</button>

<button onclick="changeSize()">
  크게 보기
</button>

<button onclick="changeBackground()">
  배경 강조
</button>

<button onclick="toggleText()">
  숨기기/보이기
</button>

<script>

let colorChanged = false;
let sizeChanged = false;
let backgroundChanged = false;

function changeColor(){

  const text =
    document.getElementById("text");

  if(colorChanged){
    text.style.color = "brown";
    colorChanged = false;
  }

  else{
    text.style.color = "blue";
    colorChanged = true;
  }
}

function changeSize(){

  const text =
    document.getElementById("text");

  if(sizeChanged){
    text.style.fontSize = "50px";
    sizeChanged = false;
  }

  else{
    text.style.fontSize = "70px";
    sizeChanged = true;
  }
}

function changeBackground(){

  const text =
    document.getElementById("text");

  if(backgroundChanged){
    text.style.backgroundColor = "gold";
    backgroundChanged = false;
  }

  else{
    text.style.backgroundColor = "pink";
    backgroundChanged = true;
  }
}

function toggleText(){

  const text =
    document.getElementById("text");

  if(text.style.display === "none"){
    text.style.display = "block";
  }

  else{
    text.style.display = "none";
  }
}

</script>

</body>
</html>
